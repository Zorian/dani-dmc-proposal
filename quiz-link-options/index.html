<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz link options</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF4F2;--paper-2:#F5E7E6;--ink:#24161F;--ink-2:#5A4652;--line:#E6D3D4;--cherry:#D6264F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:56px 24px 80px}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0;line-height:1}
h1{font-size:clamp(44px,8vw,88px);font-weight:800}
h1 span{color:var(--cherry);font-weight:400}
.lede{color:var(--ink-2);max-width:56ch;margin:16px 0 44px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
figure img{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
figcaption{padding:18px 20px 20px}
h2{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:baseline}
h2 b{color:var(--cherry)}
figcaption p{margin:6px 0 0;font-size:15px;color:var(--ink-2)}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:40px 16px 64px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Quiz link options <span>☆</span></h1>
<p class="lede">Six ways to add a quiet, clickable quiz link under "Join the free workshop" at the top of the Rebirth site. Each one is worded so she does both, the workshop and the quiz. Shown as they look on a phone.</p>
<div class="grid">
<figure><img src="option-1.jpg" alt="Option 1"><figcaption><h2><b>1</b>Text link with arrow</h2><p>"Before you join, take the confidence quiz". Underlined with an arrow, so it reads as a link. The most subtle option.</p></figcaption></figure>
<figure><img src="option-2.jpg" alt="Option 2"><figcaption><h2><b>2</b>Handwritten pen note</h2><p>Red pen and a hand-drawn arrow: "and find your Confidence Type". Matches the journal feel best.</p></figcaption></figure>
<figure><img src="option-3.jpg" alt="Option 3"><figcaption><h2><b>3</b>Butter highlighter</h2><p>"Plus, take your confidence quiz" with a highlighter swipe and underline. Ties into the brand highlighter.</p></figcaption></figure>
<figure><img src="option-4.jpg" alt="Option 4"><figcaption><h2><b>4</b>Small button</h2><p>A small butter button. The most obviously tappable on a phone, but slightly less subtle.</p></figcaption></figure>
<figure><img src="option-5.jpg" alt="Option 5"><figcaption><h2><b>5</b>"while you wait" divider</h2><p>A divider that says "while you wait", so it reads as something to do before the workshop, not instead of it.</p></figcaption></figure>
<figure><img src="option-6.jpg" alt="Option 6"><figcaption><h2><b>6</b>Star and circled word</h2><p>"Now take your confidence quiz", with the brand star, "quiz" circled in red pen and an arrow.</p></figcaption></figure>
</div>
</div>
</body>
</html>
