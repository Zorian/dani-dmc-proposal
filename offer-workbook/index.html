<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>The Offer Workbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the same long scrolling page, sticky pill nav and big type system as the Rebirth proposal,
   with white cards, ink panels and one yellow highlight on each key phrase. */
:root{
  --paper:#FBF4F2; --paper-2:#F5E7E6; --ink:#24161F; --ink-2:#5A4652; --muted:#8A7581; --line:#E6D3D4;
  --cherry:#D6264F; --cherry-deep:#A8173B; --plum:#6B4FB8; --rose:#F3D3DA; --card:#fff; --on-ink:#FBF4F2; --on-ink-2:#D9C8CF;
  --hl:#F2CE3E; --hl-soft:#FBEFB8; --r-lg:28px; --r:18px; --r-sm:10px;
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:92px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--cherry);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--head);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(52px,10.5vw,148px);font-weight:800;letter-spacing:-.045em;line-height:.92}
h1 .star{color:var(--cherry);font-weight:400}
h2{font-size:clamp(34px,5vw,56px);font-weight:800;max-width:20ch}
h3{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
p{margin:0;max-width:64ch}
.lead{font-size:clamp(18px,2vw,21px);line-height:1.45;color:var(--ink-2)}
.small{font-size:15px;color:var(--ink-2)}
.mark{background-image:linear-gradient(100deg,transparent .4%,var(--hl) 1.4%,var(--hl) 98.6%,transparent 99.6%);background-repeat:no-repeat;background-size:100% 86%;background-position:0 62%;padding:0 .14em;margin:0 -.08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.slide.seen .mark.sweep{animation:sweep .6s .1s cubic-bezier(.3,.7,.3,1) backwards}
@keyframes sweep{from{background-size:0 86%}to{background-size:100% 86%}}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,244,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:60px;min-width:0}
nav.top .brand{font:800 18px var(--head);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:999px;white-space:nowrap}
.tab:hover{background:var(--paper-2);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--on-ink)}

/* sections */
section.block{border-top:1px solid var(--line)}
section.block:first-child{border-top:0}
.slide{display:flex;flex-direction:column;gap:28px;padding-block:80px}
.sec-head{display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:end}
.sec-head p{color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:48px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* hero */
.cover{display:flex;flex-direction:column;gap:22px}
.cover img{width:min(230px,60%);height:auto;display:block;margin-bottom:12px}
.bigsis{font:600 clamp(20px,2.6vw,28px)/1.2 var(--head);color:var(--cherry);letter-spacing:-.01em}
.reach{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:28px;border-top:2px solid var(--ink)}
.reach div{padding:18px 18px 0 0;min-width:0}
.reach b{display:block;font:800 clamp(21px,2.4vw,28px)/1.1 var(--head);letter-spacing:-.02em}
.reach span{font-size:14px;color:var(--ink-2)}

/* controls */
.pill{padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px;background:var(--card);line-height:1.25;transition:background .15s,color .15s}
.pill:hover{background:var(--paper-2)}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill.ink{background:var(--cherry);color:#fff;border-color:var(--cherry)}
.pill.ink:hover{background:var(--cherry-deep)}
input[type=range]{width:100%;accent-color:var(--cherry);height:28px;cursor:pointer}

/* answers */
.ans{display:flex;flex-direction:column;gap:6px}
.ans>label{font-weight:600;font-size:16px;line-height:1.3}
.ans textarea,.ans input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font:500 18px/1.4 var(--body);color:var(--ink);resize:none;display:block;overflow:hidden;transition:border-color .15s,background .15s}
.ans textarea{min-height:76px}
.ans ::placeholder{color:var(--muted);font-weight:400}
.ans textarea:focus,.ans input:focus{outline:0;border-color:var(--cherry);box-shadow:0 0 0 3px var(--rose)}
.ans.filled textarea,.ans.filled input{background:var(--hl-soft);border-color:var(--hl)}

/* cards */
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.note h3{font-size:19px}
.inkcard{background:var(--ink);color:var(--on-ink);padding:24px;border-radius:var(--r)}
.inkcard .small{color:var(--on-ink-2)}

/* dots */
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(4px,.8vw,9px);width:min(100%,420px);padding:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.dot{aspect-ratio:1;border-radius:50%;background:var(--rose);transition:background .35s,transform .35s,box-shadow .35s}
.dot.n{background:var(--plum);transform:scale(1.04)}
.dot.g{background:var(--hl);box-shadow:0 0 0 2px var(--ink);transform:scale(1.14)}
.layer-out{min-height:110px}

/* specificity */
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scene{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:opacity .3s;display:flex;flex-direction:column;gap:6px}
.scene svg{height:70px;width:100%}
.scene h3{font-size:19px}
.meter{height:14px;border-radius:999px;overflow:hidden;background:var(--paper-2)}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--cherry);transition:width .35s}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline}
.kv b{font-size:14px;color:var(--ink-2);font-weight:500}
.kv span{font-weight:600}
.say{font:800 clamp(24px,3vw,34px)/1.12 var(--head);letter-spacing:-.02em}

/* tap cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:background .15s}
.tap:hover{background:var(--paper-2)}
.tap .more{display:none;color:var(--ink-2);font-size:16px;line-height:1.45}
.tap.on .more{display:block}
.tap .hint{font-size:14px;color:var(--muted)}
.tap.on .hint{display:none}
.tap .star{position:absolute;top:18px;right:20px;font-size:22px;line-height:1;color:var(--line)}
.tap.on .star{color:var(--cherry)}

.opt{padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:600;font-size:15px;line-height:1.3;transition:background .15s}
.opt:hover{background:var(--paper-2)}
.opt.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* path */
.path svg{width:100%;height:auto;display:block;overflow:visible}
.path .box{min-height:120px}
.quote{font:600 20px/1.3 var(--head);letter-spacing:-.01em}
.box .quote{margin-top:6px}

/* strike list */
.strike{display:block;width:100%;padding:12px 0;font-size:18px;font-weight:500;border-top:1px solid var(--line);background-image:linear-gradient(var(--cherry),var(--cherry));background-repeat:no-repeat;background-position:0 52%;background-size:0 3px;transition:background-size .3s,color .3s}
#strikes .strike:last-child{border-bottom:1px solid var(--line)}
.strike.on{background-size:100% 3px;color:var(--muted)}
#s-reveal{transition:opacity .35s}

/* flip */
.flip{perspective:1000px;display:grid;min-height:270px}
.flip>span{grid-area:1/1;backface-visibility:hidden;transition:transform .45s;padding:24px 24px 44px;border-radius:var(--r);display:flex;flex-direction:column;gap:12px;position:relative}
.flip .front{background:var(--card);border:1px solid var(--line)}
.flip .back{background:var(--ink);color:var(--on-ink);transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .back{transform:rotateY(0)}
.flip h3{font-size:15px;color:var(--cherry);font-family:var(--body);letter-spacing:0;font-weight:600}
.flip q{quotes:none;font:600 20px/1.28 var(--head);letter-spacing:-.01em}
.flip .tag{position:absolute;bottom:16px;left:24px;font-size:14px;font-style:normal;color:var(--muted)}
.flip .back h3{color:var(--hl)}

/* promise */
.promise{font:800 clamp(26px,3.5vw,44px)/1.28 var(--head);letter-spacing:-.025em;background:var(--ink);color:var(--on-ink);padding:32px 36px;border-radius:var(--r-lg)}
.promise .slot{background:var(--hl);color:var(--ink);padding:0 .18em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.promise .slot.empty{background:none;color:var(--on-ink-2);border-bottom:2px dashed var(--on-ink-2);border-radius:0;font-weight:600}
.short{font:600 clamp(20px,2.6vw,26px)/1.25 var(--head);color:var(--cherry);letter-spacing:-.01em}
.builder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.builder>div{grid-column:span 2;min-width:0}
.builder>div:nth-child(-n+2){grid-column:span 3}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--paper-2)}
.chip:hover{background:var(--rose)}

/* matrix */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:14px 12px;text-align:center;border-bottom:1px solid var(--line);font-size:16px}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;font-weight:500;padding-left:20px}
thead th{font-size:14px;font-weight:600;color:var(--ink-2);background:var(--paper-2)}
.cell{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:18px;line-height:1;color:transparent;background:var(--paper);text-align:center;transition:background .15s}
.cell:hover{background:var(--rose)}
.cell.on{background:var(--cherry);border-color:var(--cherry);color:#fff}

/* 10x */
.bignum{font:800 clamp(44px,6vw,72px)/1 var(--head);letter-spacing:-.04em;color:var(--cherry);font-variant-numeric:tabular-nums}
.bar{position:relative;height:18px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--cherry);border-radius:999px;transition:width .3s}
.val{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.val input[type=checkbox]{width:20px;height:20px;accent-color:var(--cherry);margin:0}
.val input[type=number]{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-weight:600;text-align:right;padding:2px 0}

/* role play */
.bubble{background:var(--ink);color:var(--on-ink);padding:14px 20px;border-radius:20px 20px 20px 4px;font-size:18px;max-width:46ch}
.fb{min-height:54px;color:var(--ink-2)}
.stars{font-size:26px;letter-spacing:4px;line-height:1;color:var(--line)}
.stars i{font-style:normal}
.stars i.on{color:var(--cherry)}
.q3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.q3>div{background:var(--ink);color:var(--on-ink);padding:16px;border-radius:14px;font:600 17px/1.2 var(--head)}

/* call */
.timeline{display:flex;width:100%}
.stop{min-width:0;padding:14px 10px 12px 0;border-top:4px solid var(--line);font:600 16px/1.2 var(--body);overflow-wrap:anywhere;transition:border-color .15s}
.stop small{display:block;font:500 13px var(--body);color:var(--muted);margin-top:3px}
.stop:hover{border-color:var(--rose)}
.stop.on{border-color:var(--cherry);color:var(--cherry)}
#tlBody{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px}
.wave{display:flex;align-items:center;gap:3px;height:56px}
.wave i{display:block;width:6px;border-radius:3px;background:var(--plum);animation:w 1.1s ease-in-out infinite alternate}
.wave i.focus{background:var(--ink)}
@keyframes w{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.ticks label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:16px;line-height:1.35;border-top:1px solid var(--line)}
.ticks input{width:20px;height:20px;flex:none;accent-color:var(--cherry);margin:1px 0 0}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:4px 18px;padding:16px 0;border-top:1px solid var(--line)}
.sum h3{grid-column:1/-1;font:600 14px var(--body);letter-spacing:0;color:var(--ink-2)}
.sum .t{font:600 20px/1.25 var(--head);overflow-wrap:anywhere}
.sum .t.none{font:500 15px var(--body);color:var(--muted)}
.goes{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.goes span{font-size:13px;font-weight:600;background:var(--paper-2);padding:3px 10px;border-radius:999px}
#exportBox{width:100%;height:130px;font:400 13px/1.4 var(--body);border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px}

/* session bar */
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);padding:7px;border-radius:999px;box-shadow:0 8px 24px rgba(36,22,31,.3);max-width:calc(100vw - 20px)}
.foot .pill{background:transparent;color:var(--on-ink);border-color:rgba(251,244,242,.25);padding:7px 14px;font-size:14px}
.foot .pill:hover{background:rgba(251,244,242,.12)}
.foot .next{background:var(--cherry);border-color:var(--cherry)}
.foot .next:hover{background:var(--cherry-deep)}
.foot .count{font-size:14px;color:var(--on-ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot .save{font-size:13px;color:var(--on-ink-2);white-space:nowrap}
.foot button[disabled]{opacity:.35;cursor:default}

/* presenter notes */
#notes{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--ink);color:var(--on-ink);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-shadow:-12px 0 30px rgba(36,22,31,.35);overflow:auto;z-index:25;display:flex;flex-direction:column;gap:14px}
#notes h3{color:var(--rose);font-size:18px}
#notes .say2{color:var(--on-ink-2);font-size:15px}

@media (max-width:860px){
  .slide{padding-block:56px}
  .split,.sec-head{grid-template-columns:minmax(0,1fr);gap:20px}
  .grid3,.builder{grid-template-columns:minmax(0,1fr)}
  .builder>div,.builder>div:nth-child(-n+2){grid-column:auto}
  .reach{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reach div{padding-bottom:12px}
  nav.top .brand{font-size:15px}
  .foot .save{display:none}
  #tlBody{padding:20px}
  .promise{padding:22px 20px}
}
@media (max-width:560px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav.top .brand{display:none}
  .grid2,.q3,.sum{grid-template-columns:minmax(0,1fr)}
  .timeline{flex-wrap:wrap;gap:4px}
  .stop{flex:1 1 30%!important;font-size:14px}
  .dots{padding:14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>

<nav class="top" aria-label="Chapters"><div class="wrap"><span class="brand">☆ The Offer Workbook</span><div class="tabs" id="tabs"></div></div></nav>
<main id="sheet"></main>
<div class="foot">
  <button class="pill" id="back">Back</button>
  <button class="pill next" id="next">Next</button>
  <span class="count" id="count"></span>
  <span class="save" id="save"></span>
  <button class="pill notesbtn" id="notesBtn" title="Press N">Notes</button>
</div>

const GOLDS=[{"group": "Stuck in a pattern", "label": "Overthinkers who talk themselves out of everything", "who": "overthinkers", "a": "They replay every conversation and talk themselves out of things before they start.", "b": "They decide, act and stop needing everyone's opinion first.", "o": "Waiting to feel certain before they move.", "res": "the confidence to trust themselves and act", "wo": "needing to feel ready first"}, {"group": "Stuck in a pattern", "label": "Women who hide, shrink and play small", "who": "women who shrink and play small", "a": "They stay quiet, stay in the background and let others take the room.", "b": "They speak first, get seen and take up space.", "o": "Fear of what people will think if they're seen.", "res": "the confidence to be seen and take up space", "wo": "faking a personality"}, {"group": "At a turning point", "label": "Women who've lost themselves and want to feel like themselves again", "who": "women who've lost themselves", "a": "They look fine from the outside, but don't recognise who they've become.", "b": "They feel like themselves again, and it shows.", "o": "Years of putting themselves at the bottom of the list.", "res": "a version of themselves they recognise and love again", "wo": "becoming someone new"}, {"group": "At a turning point", "label": "Women starting over after a big life change", "who": "women starting over", "a": "Life changed and they don't know who they are now.", "b": "They've built a life that's theirs, on their terms.", "o": "An identity built around how things used to be.", "res": "the confidence to build a life on their own terms", "wo": "rushing to fill the gap"}, {"group": "At a turning point", "label": "Women who've outgrown their life and want more", "who": "women who've outgrown their life", "a": "Nothing's wrong on paper, but they know there's more for them.", "b": "They've gone after the bigger life, and stopped apologising for wanting it.", "o": "Guilt about wanting more than they've got.", "res": "the confidence to go after the life they want", "wo": "feeling ungrateful"}, {"group": "Going after something", "label": "Women who want to speak up and be taken seriously at work", "who": "women who want to be taken seriously at work", "a": "They stay quiet in meetings and watch others get the credit.", "b": "They speak first, ask for the raise and go for the role.", "o": "Waiting to be noticed instead of asking.", "res": "the confidence to speak up and ask for more", "wo": "faking a personality"}, {"group": "Going after something", "label": "Women ready to charge more, ask for more and stop settling", "who": "women ready to ask for more", "a": "They undercharge, overdeliver and apologise when they ask.", "b": "They name their price and hold it.", "o": "Not believing they're worth it yet.", "res": "the confidence to ask for what they're worth", "wo": "feeling guilty about it"}, {"group": "Going after something", "label": "Women who keep settling for less than they deserve in love", "who": "women who keep settling in love", "a": "They accept less than they'd ever want for their best friend.", "b": "They know their worth before they walk in, and leave when it isn't met.", "o": "Fear of being alone.", "res": "the confidence to know their worth in love", "wo": "playing games"}];
const goldObj=()=>GOLDS.find(g=>g.label===S.a.gold)||null;
const eg=()=>goldObj()||GOLDS[0];
const CHAPTERS=["Start","Your exact client","A to B","Your way","What's inside","How you coach","Finish"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ans=(k,label,ph,one)=>`<div class="ans" data-ans="${k}"><label for="f-${k}">${label}</label>${one?`<input id="f-${k}" data-k="${k}" placeholder="${esc(ph||"Write it here")}" autocomplete="off">`:`<textarea id="f-${k}" data-k="${k}" rows="2" placeholder="${esc(ph||"Write it here")}"></textarea>`}</div>`;

/* ---------- slides ---------- */
const SL=[
{c:0,n:"Welcome",html:`
  <div class="cover">
    <img src="${LOGO}" alt="The Confidence Rebirth">
    <h1>The offer <span class="star">☆</span> <span class="mark sweep">workbook.</span></h1>
    <p class="bigsis">How a confidence coaching offer really works.</p>
    <p class="lead">You answer the questions only you can answer. You talk. I build.</p>
    <div class="reach" aria-label="Where every answer goes">
      <div><b>Your website</b><span>Headline and offers</span></div>
      <div><b>Your VSL</b><span>The script</span></div>
      <div><b>Your Instagram</b><span>Bio and content</span></div>
      <div><b>The apply form</b><span>Questions and routing</span></div>
      <div><b>The sales calls</b><span>Objections and answers</span></div>
    </div>
  </div>`,
 note:"Set the tone: this is a working session, not a pitch. She does most of the talking from here on. Everything she says becomes copy.",q:"How long will this take? Around 60 to 90 minutes. Her answers save as you go."},

{c:1,n:"The dots",html:`<h2>Most confidence coaches <span class="mark sweep">stop at the niche</span></h2>
 <div class="split"><div class="stack">
   <div class="row"><button class="pill" data-layer="1">Market</button><button class="pill" data-layer="2">Niche</button><button class="pill" data-layer="3">Your exact client</button></div>
   <div class="layer-out" id="layerOut"></div>
   <div class="row" id="goldExRow"><button class="pill" id="goldEx">Show another example</button></div>
 </div><div id="dots" class="dots"></div></div>`,
 note:"Tap Market, Niche, Your exact client in order and let the grid change. Every dot is a person. The yellow dots are her exact client, also called the Unique Value Zone: the small group you are the obvious choice for. Each dot is a woman. Today she sits at blue: women's confidence.",q:"Won't I lose people if I go smaller? She only narrows what she sells. Her personal brand stays broad."},

{c:1,n:"Pub or Michelin star",html:`<h2>Same coach. <span class="mark sweep">Very different price.</span></h2>
 <div class="split"><div class="stack">
   <div class="scenes">
    <div class="scene" id="scPub"><svg viewBox="0 0 120 74" aria-hidden="true" fill="none" stroke="#24161F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M42 18h36l-5 52H47z"/><path d="M43 30h34" /><path d="M40 18c-3-8 8-12 12-7 3-6 14-5 16 1 6-3 12 2 10 6" /></svg><h3>The pub</h3><p class="small">Struggles to get £15 a dish.</p></div>
    <div class="scene" id="scOma"><svg viewBox="0 0 120 74" aria-hidden="true" fill="none" stroke="#24161F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M14 60h92"/><path d="M26 54a34 34 0 0 1 68 0z" fill="#F3D3DA"/><circle cx="60" cy="15" r="4" fill="#fff"/></svg><h3>The Michelin star restaurant</h3><p class="small">Charges hundreds for a tasting menu.</p></div>
   </div>
   <p class="lead">The Michelin star meal doesn't have to taste dramatically better. It's the specialism and the story people pay for. Coaching works the same way.</p>
 </div><div class="stack">
   <h3>How specific are you?</h3>
   <input type="range" id="spec" min="0" max="3" step="1" value="0" aria-label="How specific are you">
   <div class="say" id="specSay"></div>
   <div class="kv"><b>They think</b><span id="specThink"></span><b>You compete with</b><span id="specComp"></span></div>
   <div><div class="small" style="margin-bottom:4px">Room to charge more</div><div class="meter"><i id="specBar"></i></div></div>
 </div></div>`,
 note:"Drag the slider slowly to the right and read each line out. Same coach, same skills. Only the sentence changes. The pub and the Michelin star restaurant are just the quick picture to make the idea stick. The meter is an illustration, not data.",q:"Is a broad confidence coach worse? Not necessarily. They're just harder to choose and harder to pay more for."},

{c:1,n:"Four rules",html:`<h2>Four rules behind <span class="mark sweep">every premium offer</span></h2>
 <div class="grid2" id="rules"></div><p class="small">Tap each one.</p>`,
 note:"Open them one at a time. Connect each to something she already knows from her own coaching before 2021.",q:"Why do people who pay more do better? They've committed, so they show up and do the work. That gives better results, better testimonials and more sales."},

{c:1,n:"Find it",html:`<h2>Now let's find <span class="mark sweep">your exact client</span></h2>
 <div class="grid2">
  ${ans("q_dm","What do women DM you about most when it comes to confidence?","What's the most common thing they tell you or ask you?")}
  ${ans("q_best","Out of the women you've mentored, who got the best results?","Who were they, and what changed?")}
  ${ans("q_self","Before you had your confidence, who were you?","What version of yourself was that?")}
  ${ans("q_pain","Which confidence problem are women most desperate to fix?","In your opinion, what do they struggle with most?")}
 </div>`,
 note:"Stay quiet and let her think. Ask for real names and real stories. Her own story is usually where her exact client is hiding.",q:"What if the answers point in different directions? Look for the woman who shows up in two or more answers."},

{c:1,n:"Pick it",html:`<div class="sec-head"><h2>Pick one. <span class="mark sweep">You can widen it later.</span></h2><p>It doesn't have to be a type of woman. It can be the pattern they're stuck in, the moment they're in, or what they're going after. They all still sit under confidence.</p></div>
 <div class="grid3" id="goldOpts"></div>
 <div class="split"><div class="stack">
  ${ans("gold","Your exact client, in your own words","Pick one above and change the words, or write your own")}
 </div><div class="stack">
  <h3>Does it pass?</h3>
  <div class="ticks">
   <label><input type="checkbox" data-t="g1"><span>You've lived it, or got women results with it</span></label>
   <label><input type="checkbox" data-t="g2"><span>Women already DM you about it</span></label>
   <label><input type="checkbox" data-t="g3"><span>You could talk about it every day for a year</span></label>
  </div>
 </div></div>
 <p class="small">Your personal brand stays broad. The Rebirth sells one clear transformation.</p>`,
 note:"These are starting points, so don't let her get stuck on the exact wording. Ask which three feel closest, cross off two, then change the words until it sounds like her. Her choice fills in the examples for the rest of the session.",q:"Isn't this still broad? It's broad on who, but specific on the problem. That's enough to write a clear promise, and it keeps confidence in every area of life on the table."},

{c:2,n:"Point A to Point B",html:`<h2>You take them from <span class="mark sweep">Point A to Point B</span></h2>
 <div class="split"><div class="stack path">
   <svg viewBox="0 0 600 220" role="img" aria-label="A path from point A to point B">
     <path id="pBase" d="M40 190 C 180 190, 210 110, 300 110 S 430 34, 560 34" fill="none" stroke="#24161F" stroke-width="3"/>
     <path id="pHl" d="M40 190 C 180 190, 210 110, 300 110 S 430 34, 560 34" fill="none" stroke="#F2CE3E" stroke-width="16" stroke-linecap="round"/>
     <use href="#pBase"/>
     <circle cx="40" cy="190" r="11" fill="#D6264F"/><text x="26" y="168" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="18" fill="#24161F">A</text>
     <circle cx="560" cy="34" r="11" fill="#6B4FB8"/><text x="552" y="16" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="18" fill="#24161F">B</text>
     <g id="pStar"><circle r="17" fill="#24161F"/><text text-anchor="middle" y="7" font-size="20" fill="#F2CE3E">★</text></g>
   </svg>
   <input type="range" id="pRange" min="0" max="100" value="0" aria-label="Move along the path">
   <div class="note box" id="pBox"></div>
 </div><div class="stack">
   ${ans("pointA","Point A: where are they today?","What does a bad Tuesday look like?")}
   ${ans("obst","What's standing in their way?","The real reason they're stuck")}
   ${ans("pointB","Point B: where are they once they finish?","What can they do now that they couldn't before?")}
 </div></div>`,
 note:"This is the whole job of a coach. Drag the star along the line. Then get her to describe Point A in the words her followers actually use. Those exact words become VSL lines and captions.",q:"Point B is what they get once they finish the course. Keep asking: and what does that let them do?"},

{c:2,n:"Outcomes",html:`<h2>People don't buy coaching. <span class="mark sweep">They buy outcomes.</span></h2>
 <div class="split"><div class="stack">
  <p class="lead">Every buyer has one question: what exactly will I get from working with you?</p>
  <div class="say" id="sharpSay" style="min-height:3.5em"></div>
  <div class="row"><button class="pill ink" id="sharpBtn">Make it more specific</button></div>
  <div><div class="small" style="margin-bottom:4px">How easy it is to justify paying</div><div class="meter"><i id="sharpBar"></i></div></div>
 </div><div class="stack">
  ${ans("outcome","What exactly will they get from working with you?","Something they could point at and say: I did that")}
  <div class="inkcard"><h3 style="color:var(--hl)">Your clients already said it</h3><p style="margin-top:6px">“It was worth every penny.” “I love the person I am becoming.” What had actually changed for them?</p></div>
 </div></div>`,
 note:"Tap the button three times. The more measurable the promise, the easier it is for someone to justify the investment. Those quotes are from testimonials on the site: ask what actually changed for those women.",q:"Can I promise a result? Promise the work and the path, and show real results. Never guarantee an income or a specific outcome."},

{c:2,n:"Prove it",html:`<div class="sec-head"><h2>Make confidence <span class="mark sweep">something you can see</span></h2><p>Confidence feels vague. So we give them five things to hold on to.</p></div>
 <div class="grid2">
  ${ans("r_out","Specific outcomes","Asks for the raise",1)}
  ${ans("r_meas","Measurable improvements","Self rating moves from 4 out of 10 to 8",1)}
  ${ans("r_time","A realistic timeframe","8 weeks",1)}
  ${ans("r_sign","Signs it's working","Speaks first on a team call",1)}
 </div>
 ${ans("r_past","Past client transformations","Who changed, and how? Jada, Taylor, Jaleesa...")}`,
 note:"The grey text in each line is an example. Replace it with hers. The confidence score idea means every client rates themselves at the start, midpoint and end, which also gives you proof to post.",q:"Do I need numbers for everything? No. A clear moment works just as well: they spoke first, they booked the trip."},

{c:3,n:"Unique solution",html:`<h2>They've already <span class="mark sweep">tried everything</span></h2>
 <div class="split"><div class="stack">
  <p class="small">Tap each one to cross it out.</p>
  <div id="strikes"></div>
  <div class="inkcard" id="s-reveal" style="opacity:.25"><p style="font-size:19px">They aren't only buying a result. They're buying <b>your path</b> to it. That's what gives them hope that this time will be different.</p></div>
 </div><div class="stack">
  ${ans("tried","What have they tried that didn't work?","What do your DMs say?")}
  ${ans("diff","What do you do differently from everyone else?","What would they never get from another coach?")}
 </div></div>`,
 note:"Also known as the unique mechanism. Your solution isn't just what you do. It's how you do it differently. People who've failed before need a reason to believe this time won't be the same.",q:"What if what I do isn't that new? It rarely is. Her order, her language and her method are what make it hers."},

{c:3,n:"Name it",html:`<h2>Give your path <span class="mark sweep">a name</span></h2>
 <div class="split"><div class="stack">
  <p>A method with a name feels like a real system. It's yours, and nobody else can offer it.</p>
  <div class="note"><div class="small">Idea</div><div class="say" id="nameIdea" style="margin:4px 0 10px"></div>
   <div class="row"><button class="pill" id="nameNext">Another idea</button><button class="pill ink" id="nameUse">Use this name</button></div></div>
 </div><div class="stack">
  ${ans("method","Your method's name","The ... Method",1)}
  <h3>Its three stages</h3>
  ${ans("m1","Stage one","Where every client starts",1)}
  ${ans("m2","Stage two","The middle of the work",1)}
  ${ans("m3","Stage three","How they finish",1)}
 </div></div>`,
 note:"The names are only sparks. The stages can become the course modules, the weeks of the Circle and the VSL structure. Three is enough. Coming back to you is already in the slogan, so that's a strong thread to pull.",q:"Can we change it later? Yes, but pick one to test today."},

{c:3,n:"Instead of",html:`<h2>Instead of this, <span class="mark sweep">you say that</span></h2>
 <div class="grid3" id="flips"></div><p class="small">Tap a card to turn it over. These are examples to show the difference.</p>`,
 note:"Read the front in a flat voice, then flip and read the back. Same person, a totally different sale. Ask which back she could picture on her bio.",q:""},

{c:3,n:"Your promise",html:`<h2>Your whole offer, <span class="mark sweep">in one sentence</span></h2>
 <div class="promise" id="promise" aria-live="polite"></div>
 <div class="short" id="shortLine"></div>
 <div class="builder">
  <div>${ans("who","I help","Who?",1)}</div>
  <div>${ans("result","Achieve","What result?",1)}</div>
  <div>${ans("method","Through my","Which method?",1).replace(/f-method/g,"f-method2")}</div>
  <div>${ans("without","Without","What do they hate?",1)}<div class="chips" id="woChips"></div></div>
  <div>${ans("time","In","How long?",1)}<div class="chips" id="tChips"></div></div>
 </div>`,
 note:"This is the most important sheet today. Don't move on until she'd happily say it out loud. This line anchors the website hero, Instagram bio, VSL and sales calls. Read it back to her.",q:"Too long for a bio? Use the short version underneath: we help X achieve X."},

{c:4,n:"What they get",html:`<div class="sec-head"><h2>Decide what goes <span class="mark sweep">in each level</span></h2><p>Tap a circle to add it or take it out. This is what makes the price feel obvious.</p></div>
 <div class="tablewrap"><table id="matrix"></table></div>
 ${ans("loved","Your past clients mention the workbook. What else did they use the most?","What did they keep coming back to?")}`,
 note:"Starting point comes from the website: replays and workbooks are already listed. I'd add one thing a client can use straight after each call. It makes the price easy to explain and keeps results moving. Scripts give them the exact words for scary moments, which is what confidence clients ask for most.",q:"Is this more work for me? No. You record the calls and make the content once. The back end is on me."},

{c:4,n:"The 10x rule",html:`<h2>The <span class="mark sweep">10x rule</span></h2>
 <div class="split"><div class="stack">
  <p>When they can clearly see 10 times the value of the price, the decision gets easy.</p>
  <div><h3>Test price: The Rebirth Circle</h3><div class="bignum" id="priceOut"></div>
  <input type="range" id="price" min="300" max="5000" step="50" aria-label="Test price"></div>
  <div class="small">Value they need to see: <b id="target"></b></div>
  <div class="bar"><i id="valBar"></i></div>
  <div id="verdict" style="font-weight:700;min-height:3em"></div>
 </div><div class="stack">
  <h3>What is it worth to them? Tick and change the numbers.</h3>
  <div class="stack" id="vals" style="gap:6px"></div>
  ${ans("cost","What does staying stuck cost them every year?","Money, chances, years")}
  <p class="small">These numbers are examples for working out the price. We don't promise them to anyone.</p>
 </div></div>`,
 note:"Drag the price, tick the values and see where the bar lands. It's a thinking tool. Don't use these figures in marketing as promises or typical results. The price here isn't final and it stays hidden on the site.",q:"Isn't confidence priceless? It is, and that's why they also need something concrete to justify it."},

{c:5,n:"What's in their head",html:`<div class="sec-head"><h2>They're asking <span class="mark sweep">three questions</span></h2><p>Clients don't just want advice. They want a solution to their problem.</p></div>
 <div class="grid3" id="three"></div>
 ${ans("q1proof","What's your strongest proof that you can solve this?","A story, a result, a testimonial")}`,
 note:"From here on, I'm teaching her how to be a great coach, not just sell one. These questions never stop, even after they've paid. Every call should answer all three.",q:""},

{c:5,n:"The doctor approach",html:`<h2>A doctor <span class="mark sweep">examines first</span></h2>
 <div class="split"><div class="stack">
  <p>Before you prescribe, you ask. Ask yourself these on every check in call.</p>
  <div class="q3"><div>Where are they right now?</div><div>Where do they want to get to?</div><div>What's stopping them?</div></div>
  <div class="stars" id="rpStars" aria-label="Score"></div>
 </div><div class="stack" id="rp"></div></div>`,
 note:"Let her pick. When she's chosen, read the feedback. Good coaching is mostly asking the right question and listening properly. The answers tell you the exact next step for that client.",q:"When do I give advice? After you understand the problem. Then one clear step, not five tips."},

{c:5,n:"Call structure",html:`<h2>Every call runs <span class="mark sweep">the same way</span></h2>
 <div class="timeline" id="tl"></div>
 <div id="tlBody"></div>`,
 note:"Tap through in order. Width shows a suggested split for a 60 minute call. Change it to suit her. A set structure means she never walks into a call wondering what to do. Clients feel looked after and it's easy to repeat.",q:"Will this feel robotic? No. The structure stays the same, while the conversation is always hers."},

{c:6,n:"Everything you said",html:`<h2>Here's <span class="mark sweep">your offer</span></h2>
 <div class="promise" id="promise2"></div>
 <div id="sumList"></div>
 <div class="row"><button class="pill ink" id="copyAll">Copy all answers</button><span id="copyMsg" class="small" aria-live="polite"></span></div>
 <textarea id="exportBox" readonly hidden aria-label="All answers"></textarea>`,
 note:"Read the promise once more and enjoy it. Tap Copy all and send me the text so I can turn it into the website, VSL script and content.",q:""},

{c:6,n:"What happens next",html:`<h2>You did the hard part. <span class="mark sweep">Here's what's next.</span></h2>
 <div class="split"><div class="stack">
  <h3>Decide today</h3>
  ${ans("d_price","Founding member price for The Club","Currently $33 a month",1)}
  ${ans("d_cap","How many founding members?","A number makes it real",1)}
  ${ans("d_date","Next free workshop date","The site says 12 Nov for now",1)}
 </div><div class="stack">
  <h3>You</h3>
  <div class="ticks" data-group="you">
   <label><input type="checkbox" data-t="t1"><span>Screenshot 20 to 30 DMs from followers</span></label>
   <label><input type="checkbox" data-t="t2"><span>Ask 5 followers: what's your biggest struggle, what have you tried, what would change your life?</span></label>
   <label><input type="checkbox" data-t="t3"><span>Get 3 to 5 more testimonials, on video if you can</span></label>
   <label><input type="checkbox" data-t="t4"><span>Film the VSL once I send the script</span></label>
  </div>
  <h3>Me</h3>
  <div class="ticks">
   <label><input type="checkbox" data-t="t5"><span>Rewrite the website around your promise</span></label>
   <label><input type="checkbox" data-t="t6"><span>Write your VSL script from your answers</span></label>
   <label><input type="checkbox" data-t="t7"><span>Turn Point A and Point B into your content ideas</span></label>
   <label><input type="checkbox" data-t="t8"><span>Build the apply form and call scripts around your outcomes</span></label>
  </div>
 </div></div>`,
 note:"End on the fact she's done the part only she could do. Book the next session before you leave.",q:""}
];

/* ---------- render ---------- */
const sheet=document.getElementById("sheet");
sheet.innerHTML=SL.map((s,i)=>`<section class="block" aria-label="${esc(s.n)}"><div class="wrap slide" id="sl${i}">${s.html}</div></section>`).join("");
document.getElementById("tabs").innerHTML=CHAPTERS.map((c,i)=>`<button class="tab" data-ch="${i}">${esc(c)}</button>`).join("");
let cur=0;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function setCurrent(i){
  cur=i;
  $$(".slide")[cur].classList.add("seen");
  $$(".tab").forEach((t,n)=>{const on=n===SL[cur].c;t.classList.toggle("on",on);if(on){const w=t.parentElement;w.scrollLeft=t.offsetLeft-w.offsetLeft-w.clientWidth/2+t.offsetWidth/2}});
  $("#count").textContent=`${cur+1} of ${SL.length}`;
  $("#back").disabled=cur===0; $("#next").disabled=cur===SL.length-1;
  renderNotes(); onEnter();
}
function go(i){
  i=Math.max(0,Math.min(SL.length-1,i));
  $$(".slide")[i].parentElement.scrollIntoView();
  setCurrent(i);
}
let scrollTick=false;
addEventListener("scroll",()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{scrollTick=false;
  const mid=innerHeight*.4;let at=0;$$(".slide").forEach((el,n)=>{if(el.getBoundingClientRect().top<=mid)at=n});
  if(at!==cur)setCurrent(at)})},{passive:true});
function renderNotes(){
  const n=SL[cur];
  $("#notes").innerHTML=`<div class="row" style="justify-content:space-between"><h3>Notes for you</h3><button class="pill" id="notesClose" style="background:transparent;color:var(--on-ink);border-color:var(--on-ink-2)">Close</button></div><p>${esc(n.note)}</p>${n.q?`<h3>If it comes up</h3><p class="say2">${esc(n.q)}</p>`:""}`;
  $("#notesClose").onclick=toggleNotes;
}
function toggleNotes(){const el=$("#notes");el.hidden=!el.hidden}
$("#notesBtn").onclick=toggleNotes;
$("#back").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);

/* dots */

for(let r=0;r<4;r++)for(let c=6;c<10;c++)NICHE.add(r*10+c);

 {m:"I froze in the meeting again. I just can't speak up.",o:[["Here are five tips for speaking up in meetings.",0,"That's the prescription before the examination. You don't know why they froze yet."],["Walk me through the moment just before you went quiet.",1,"Yes. Now you know where they are and what's really stopping them."]]},

/* call structure */
const STOPS=[
 {n:"Intro",m:5,h:"Build rapport and check on progress",b:`<div class="split"><div class="stack"><p>Keep it natural. Help them feel comfortable, then check in.</p><div class="quote">“What's one brave thing, however small, you did this past week?”</div></div><div class="stack"><div class="quote">“On a scale of 1 to 10, how confident have you felt this week?”</div><input type="range" id="scale" min="1" max="10" value="6" aria-label="Progress score"><div class="bignum" id="scaleOut">6</div><p class="small">Log this number every week. It's their confidence score, and your proof.</p></div></div>`},
 {n:"Set agenda",m:3,h:"Say what today is for",b:`<div class="stack"><p>Tell them what you'll cover so they know where the time is going. Then let them add to it.</p><div class="quote">“Today I want to cover how that conversation with your boss went, and your plan for next week. Anything you want to add?”</div></div>`},
 {n:"Transition",m:2,h:"Change your tone",b:`<div class="split"><div class="stack"><p>Move from chatting to working. Your voice shifts, so they know you're serious about getting them results.</p><div class="quote">“So glad you had a good week. Cool if we jump straight into week two of the work?”</div></div><div class="stack"><div class="wave" id="wave" aria-hidden="true"></div><p class="small">Warm and chatty, then calm and focused.</p></div></div>`},
 {n:"Coaching",m:40,h:"Where are they, where to next, what's stopping them",b:`<div class="split"><div class="stack"><p>Most of the call. Ask, listen, then give one clear next step. This is where your method does the work.</p><p class="small">You coach, you don't treat. Refer trauma, eating problems or thoughts of harming themselves to a professional.</p><div class="quote">“Where did you shrink this week, and what were you afraid would happen if you didn't?”</div></div><div class="stack">${ans("coachq","Your best question: the one that always unlocks people","What do you always end up asking?")}</div></div>`},
 {n:"Actionables",m:10,h:"Agree what they do before the next call",b:`<div class="split"><div class="stack"><p>Be clear that these get done before the next call. That's how they keep moving.</p><div class="quote">“So this week you speak first in one meeting and fill in your worksheet. You're clear on that? And you know where to find everything?”</div></div><div class="ticks stack" style="gap:0"><label><input type="checkbox"><span>They know exactly what to do</span></label><label><input type="checkbox"><span>They know where to find everything</span></label><label><input type="checkbox"><span>They know it's due before the next call</span></label></div></div>`}
];

$("#tl").onclick=e=>{const b=e.target.closest("[data-s]");if(b){stopI=+b.dataset.s;drawStop()}};

function exportText(){
  const L=[];const push=(t,v)=>{if(v&&String(v).trim())L.push(t+": "+v)};
  L.push("THE OFFER WORKBOOK");push("Promise",promiseText());push("Short",shortText());

  Object.keys(labels).forEach(k=>push(labels[k],S.a[k]));
  L.push("Test Circle price: "+money(S.price));
  L.push("What's in each level:");

}

/* shared store: keeps answers safe beyond this browser when the page is hosted as an artifact */
(async()=>{
  const c=window.claude;if(!c||!c.use){saveEl().textContent="Saved on this device. Use Copy all at the end.";return}
  try{
    db=await c.use("db");
    if(!db){saveEl().textContent="Saved on this device. Use Copy all at the end.";return}
    const snap=await db.doc("sessions/dani").get();
    if(snap.exists){const d=snap.data();if(d&&d.savedAt>(S.savedAt||0)&&d.state){const hasFocus=/INPUT|TEXTAREA/.test(document.activeElement.tagName);S=Object.assign(S,JSON.parse(d.state));migrate();if(!hasFocus){fillInputs();drawMatrix();drawVals();drawTen();syncAll();grow();$$("[data-t]").forEach(t=>t.checked=!!S.done[t.dataset.t])}}}
    saveEl().textContent="Answers save automatically";
  }catch(e){db=null;saveEl().textContent="Saved on this device. Use Copy all at the end."}
})();
